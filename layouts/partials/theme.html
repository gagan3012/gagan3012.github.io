<script>
(function () {
  var root = document.documentElement;
  var systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
  var preference = null;
  var button;

  function readPreference() {
    try {
      var saved = localStorage.getItem("theme");
      return saved === "dark" || saved === "light" ? saved : null;
    } catch (error) { return null; }
  }

  function applyTheme() {
    var theme = preference || (systemTheme.matches ? "dark" : "light");
    root.setAttribute("data-theme", theme);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#151e19" : "#f7f7f0");
    if (button) {
      button.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
      button.setAttribute("aria-label", button.title);
    }
  }

  // Set the theme before the stylesheet loads to avoid a light flash.
  preference = readPreference();
  applyTheme();
  systemTheme.addEventListener("change", applyTheme);
  window.addEventListener("storage", function (event) {
    if (event.key === "theme" || event.key === null) {
      preference = readPreference();
      applyTheme();
    }
  });
  document.addEventListener("DOMContentLoaded", function () {
    button = document.querySelector(".theme-toggle");
    if (!button) return;
    applyTheme();
    button.hidden = false;
    button.addEventListener("click", function () {
      preference = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      try { localStorage.setItem("theme", preference); } catch (error) {}
      applyTheme();
    });
  });
})();
</script>
