<noscript><style>
  .reveal { opacity: 1 !important; transform: none !important; }
  .pub-list.is-collapsed .pub-hidden { display: grid !important; }
  .show-all { display: none !important; }
</style></noscript>
<script>
document.addEventListener("click", function (e) {
  var btn = e.target.closest(".show-all");
  if (!btn) return;
  var list = document.getElementById(btn.getAttribute("data-target"));
  if (!list) return;
  var collapsed = list.classList.toggle("is-collapsed");
  btn.textContent = collapsed ? btn.getAttribute("data-more") : btn.getAttribute("data-less");
  if (collapsed) list.scrollIntoView({ block: "start", behavior: "smooth" });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var items = document.querySelectorAll(".reveal");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduced || !("IntersectionObserver" in window)) {
    items.forEach(function (el) { el.classList.add("is-visible"); });
    return;
  }

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      }
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });

  items.forEach(function (el) { observer.observe(el); });
});

document.addEventListener("DOMContentLoaded", function () {
  var modal = document.getElementById("bib-modal");
  if (!modal) return;
  var codeEl = document.getElementById("bib-modal-code");
  var titleEl = document.getElementById("bib-modal-title");
  var copyBtn = modal.querySelector(".copy-btn");

  function open(trigger) {
    var source = trigger.parentElement.querySelector(".bib-source");
    if (!source) return;
    codeEl.textContent = source.textContent.trim();
    titleEl.textContent = trigger.getAttribute("data-title") || "BibTeX";
    copyBtn.textContent = "Copy";
    copyBtn.classList.remove("is-copied");
    if (typeof modal.showModal === "function") { modal.showModal(); }
    else { modal.setAttribute("open", ""); }
  }

  function close() {
    if (typeof modal.close === "function") { modal.close(); }
    else { modal.removeAttribute("open"); }
  }

  document.addEventListener("click", function (e) {
    var trigger = e.target.closest(".bib-trigger");
    if (trigger) { e.preventDefault(); open(trigger); return; }
    if (e.target.closest(".bib-close")) { close(); return; }

    var btn = e.target.closest(".copy-btn");
    if (btn && navigator.clipboard) {
      navigator.clipboard.writeText(codeEl.textContent).then(function () {
        btn.textContent = "Copied";
        btn.classList.add("is-copied");
        setTimeout(function () {
          btn.textContent = "Copy";
          btn.classList.remove("is-copied");
        }, 1600);
      });
    }
  });

  // Click outside the panel closes the dialog.
  modal.addEventListener("click", function (e) {
    if (!e.target.closest(".bib-modal-inner")) close();
  });
});
</script>
