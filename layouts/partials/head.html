<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c10">
<title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.description }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">

<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/photo.jpg" | absURL }}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
<link rel="icon" type="image/png" href="{{ "favicon-32x32.png" | relURL }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">

{{ $style := resources.Get "css/style.css" }}
{{ if hugo.IsProduction }}{{ $style = $style | minify | fingerprint }}{{ end }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}"{{ with $style.Data.Integrity }} integrity="{{ . }}"{{ end }}>

{{ if .Site.Params.mysite.discovery }}
<meta name="generator" content="Created using GaryKing.org/mysite (https://gking.harvard.edu/mysite)">
{{ if .IsHome }}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"{{ .Site.Params.author }}","affiliation":{"@type":"Organization","name":"{{ .Site.Params.institution }}"},"url":"{{ .Site.BaseURL }}","isBasedOn":"https://gking.harvard.edu/mysite"}
</script>
{{ end }}
{{ end }}
</head>
