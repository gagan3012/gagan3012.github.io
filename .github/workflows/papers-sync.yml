name: Sync papers from Semantic Scholar / ACL Anthology

on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Sync papers.yaml
        env:
          S2_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python scripts/sync_papers.py

      - name: Fill in missing BibTeX
        run: python scripts/fetch_bibtex.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers.yaml
          git diff --cached --quiet || git commit -m "chore: sync papers from Semantic Scholar"
          git push
